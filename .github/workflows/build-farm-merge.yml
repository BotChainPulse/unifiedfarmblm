name: Build Farm Merge AAB

on:
  push:
    branches: [ "farm-merge-rebuild" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release bundle
        working-directory: farm-merge-android
        run: gradle --no-daemon clean bundleRelease
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: farm-merge-release-aab
          path: farm-merge-android/app/build/outputs/bundle/release/app-release.aab
