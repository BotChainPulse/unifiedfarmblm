name: Build PixelQuote AAB

on:
  push:
    branches: [ "pixelquote-rebuild" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PixelQuote source
        run: |
          cat pixelquote-build-src/part*.b64 > /tmp/pixelquote-src.b64
          base64 -d /tmp/pixelquote-src.b64 > /tmp/pixelquote-src.tar.gz
          tar -xzf /tmp/pixelquote-src.tar.gz
          test -f pixelquote-android/app/build.gradle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release bundle
        working-directory: pixelquote-android
        run: gradle --no-daemon clean bundleRelease
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: pixelquote-release-aab
          path: pixelquote-android/app/build/outputs/bundle/release/app-release.aab
